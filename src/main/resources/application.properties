spring.application.name=observatory

# Clever Cloud sets PORT=8080; Spring Boot listens on 0.0.0.0 by default.
server.port=${PORT:8080}

# The MongoDB add-on injects MONGODB_ADDON_URI (it includes the database name).
# Locally, a MongoDB on localhost is used instead.
spring.data.mongodb.uri=${MONGODB_ADDON_URI:mongodb://localhost:27017/observatory}

spring.threads.virtual.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
spring.main.banner-mode=off

# Validation messages in English whatever the server or browser locale.
spring.web.locale=en
spring.web.locale-resolver=fixed
